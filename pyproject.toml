[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dsi-watch-time"
version = "0.1.0"
description = "Distributional serving interfaces for watch-time estimation and decision readout"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numba>=0.58",
  "numpy>=1.24,<2.1",
  "pandas>=2.0",
  "PyYAML>=6.0",
  "scikit-learn>=1.3",
  "torch>=2.1",
]

[project.scripts]
dsi = "dsi.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dsi*", "baselines*", "preprocess*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
